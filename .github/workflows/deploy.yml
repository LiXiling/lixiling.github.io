name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy run as separate jobs: deploy-pages lists the run's artifacts, and an
# artifact uploaded earlier in the same job was not yet listed (all deploys on 2026-11-25).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Publish only the site: no CV sources, fonts or repo notes, just the CV PDFs.
      - name: Assemble site
        run: |
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'CLAUDE.md' --exclude 'cv/' --exclude '_site' ./ _site/
          mkdir -p _site/cv
          cp cv/*.pdf _site/cv/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
